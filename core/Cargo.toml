[package]
name = "sysmon-core"
version = "1.1.1"
description = "Núcleo compartido del widget: estado, muestreo y formateadores (sin UI)"
authors = ["Breiner"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
wmi = "0.17"
is_elevated = "0.1"

[target.'cfg(windows)'.dependencies]
# Job Object (kill-on-close) para no dejar typeperf huérfano al salir.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
