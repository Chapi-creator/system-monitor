[package]
name = "system-monitor-widget"
version = "1.0.0"
description = "Widget flotante de monitoreo del sistema (CPU / RAM / GPU / Red / Temp)"
authors = ["Breiner"]
license = "MIT"
edition = "2021"

# The library is generated by tauri-build; keep the binary name matching the product.
[[bin]]
name = "system-monitor-widget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
wmi = "0.17"
is_elevated = "0.1"

# Job Object (kill-on-close) para no dejar typeperf huérfano al salir.
# 0.61 ya está en el árbol de dependencias de tauri: cero bins nuevos.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
# tauri::test (mock_app / MockRuntime) para probar comandos y eventos sin GUI.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
