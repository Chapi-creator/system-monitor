[package]
name = "system-monitor-widget"
version = "1.1.0"
description = "Widget flotante de monitoreo del sistema (CPU / RAM / GPU / Red / Temp)"
authors = ["Breiner"]
license = "MIT"
edition = "2021"

[lib]
name = "system_monitor_widget_lib"
path = "src/lib.rs"

# The library is generated by tauri-build; keep the binary name matching the product.
[[bin]]
name = "system-monitor-widget"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sysmon-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[dev-dependencies]
# tauri::test (mock_app / MockRuntime) para probar comandos y eventos sin GUI.
tauri = { version = "2", features = ["test"] }
